# =============================================================================
# ACTUALIZACIÓN MENSUAL: editar solo inference.cutoff (mes a predecir, YYYY-MM-DD)
# =============================================================================
inference:
  cutoff: "2025-12-01"
  # Notebook: ventana de ``cant_periodos`` meses calendario (p. ej. 24); pivote wide = 12 meses 1–6.
  cant_periodos: 24
  contratos_list: null  # null = todos los contratos con consumo en la ventana
  columns_filter: null # ej: { localidad: ["1", "2"], estrato: ["1", "2", "3"] } — filtra antes de tsfel
    # zona: ['4.0']
  # Columnas en el CSV de scores (null = solo contrato y score)
  output_columns: ['contrato', 'municipio', 'zona', 'colonia', 'fecha_medidor', 'tipo', 'desc_categoria', 'es_digital']

paths:
  raw: "data/raw"
  interim: "data/interim"
  processed: "data/processed"
  models: "models"
  predictions: "data/predictions"
  logs: "data/logs"

# Nivel de log: DEBUG, INFO, WARNING, ERROR
log_level: "INFO"

etl:
  sources:
    - inspecciones
    - consumo
    - maestro
  overwrite: false  # true = reprocesar todo; CLI --overwrite lo sobreescribe

# Train: null = todas las inspecciones disponibles (sin límite de fecha)
train:
  cutoff: "2023-05-01"
  cant_periodos: 24
  # Fechas de corte: inspecciones con date >= fecha_ancla + cant_periodos (notebook 2021-01-01 + 24 meses).
  fecha_ancla_ordenes: "2021-01-01"
  max_ctas_neg: 1_000
  sam_th: 0.3
  param_imb_method: "over"
  preprocesor_num: 3
